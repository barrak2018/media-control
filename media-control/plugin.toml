id = "barrak2018/media-control"
name = "Media Control"
version = "0.1.0"
plugin_api = 24
author = "barrak2018"
license = "MIT"
icon = "player-play"
dependencies = ["playerctl"]
description = "MPRIS media control for the bar with rotated 90 degree text."
tags = ["bar", "media", "music"]

[[widget]]
id = "media"
entry = "media.luau"

[widget.actions]
right = "media toggle"

[[widget.setting]]
key = "text_engine"
type = "select"
label_key = "settings.text_engine.label"
description_key = "settings.text_engine.description"
default = "imagemagick"
options = [
  { value = "imagemagick", label_key = "settings.text_engine.imagemagick" },
  { value = "pillow",      label_key = "settings.text_engine.pillow" },
  { value = "none",        label_key = "settings.text_engine.none" },
]

[[widget.setting]]
key = "bar_side"
type = "select"
label_key = "settings.bar_side.label"
description_key = "settings.bar_side.description"
default = "left"
options = [
  { value = "left",  label_key = "settings.bar_side.left" },
  { value = "right", label_key = "settings.bar_side.right" },
]

[[widget.setting]]
key = "font_name"
type = "string"
label_key = "settings.font_name.label"
description_key = "settings.font_name.description"
default = "Cantarell"

[[widget.setting]]
key = "max_label_len"
type = "int"
label_key = "settings.max_label_len.label"
description_key = "settings.max_label_len.description"
default = 22
min = 6
max = 48

[[widget.setting]]
key = "show_controls"
type = "bool"
label_key = "settings.show_controls.label"
description_key = "settings.show_controls.description"
default = true

[[widget.setting]]
key = "open_commands"
type = "string_map"
label_key = "settings.open_commands.label"
description_key = "settings.open_commands.description"
default = { "spotify" = "spotify-launcher", "vlc" = "vlc" }